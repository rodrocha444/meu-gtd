<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Dark obsidian gradient for premium depth -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14161f"/>
      <stop offset="100%" stop-color="#08090d"/>
    </linearGradient>

    <!-- Subtle specular hairline border for contrast on light and dark backgrounds -->
    <linearGradient id="borderHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.12)"/>
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)"/>
    </linearGradient>

    <!-- Clean, vibrant GTD Flow gradient: Sky 400 -> Blue 500 -> Indigo 500 -->
    <linearGradient id="checkGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="48%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>

  <!-- Base Squircle -->
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>

  <!-- Subtle Specular Inner Rim -->
  <rect x="1.5" y="1.5" width="509" height="509" rx="114.5" fill="none" stroke="url(#borderHighlight)" stroke-width="2"/>

  <!-- Minimalist Geometric Checkmark -->
  <path d="M142 268 L222 348 L370 172" 
        fill="none" 
        stroke="url(#checkGrad)" 
        stroke-width="48" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
</svg>
